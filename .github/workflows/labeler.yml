name: Auto-label and phase admission

# This workflow reads policy from protected main and never executes PR code.
# Only measurable feature PRs for a frozen, active benchmark may remain open.

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-label-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-admission:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Label subsystems from changed paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Enforce current phase
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            const { owner, repo } = context.repo;

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: "benchmarks/attention-foundation-v1-rtx5070ti.json",
              ref: context.payload.repository.default_branch,
            });
            const manifest = JSON.parse(
              Buffer.from(response.data.content, "base64").toString("utf8")
            );
            const active =
              manifest.status === "frozen" &&
              manifest.decision.merge_enabled === true &&
              manifest.decision.calibration_required === false;

            const explicitFeature =
              /^\s*(feat|feature)(\([^)]+\))?:/i.test(title) ||
              /^\s*\[\s*(feat|feature)\s*\]/i.test(title) ||
              /^\s*-\s*\[[xX]\]\s*feature\b/im.test(body);
            const forbiddenLane =
              /^\s*(fix|bug|docs?|chore|refactor)(\([^)]+\))?:/i.test(title) ||
              /^\s*-\s*\[[xX]\]\s*(fix|bug|docs?|cleanup)\b/im.test(body);
            const benchmarkMatch = /\*\*Benchmark:\*\*\s*`?\s*([A-Za-z0-9_.-]+)\s*`?/i.exec(body);
            const closesMatch = /^\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/im.exec(body);
            const errors = [];

            if (!explicitFeature || forbiddenLane) {
              errors.push("Only measurable feature PRs are accepted in the active mining lane.");
            }
            if (!active) {
              errors.push(`Benchmark ${manifest.id} is ${manifest.status}; miner PRs open only after calibration and certification.`);
            }
            if (!benchmarkMatch || benchmarkMatch[1] !== manifest.id) {
              errors.push(`Declare **Benchmark:** \`${manifest.id}\` exactly.`);
            }
            if (!closesMatch) {
              errors.push("The PR must close an approved current-phase issue using `Closes #NUMBER`.");
            } else {
              const issueNumber = Number(closesMatch[1]);
              try {
                const linked = await github.rest.issues.get({
                  owner, repo, issue_number: issueNumber,
                });
                const labels = new Set(
                  linked.data.labels.map(label => typeof label === "string" ? label : label.name)
                );
                if (
                  linked.data.state !== "open" ||
                  linked.data.pull_request ||
                  !labels.has("status:phase-approved")
                ) {
                  errors.push(`Issue #${issueNumber} is not an open maintainer-approved current-phase issue.`);
                }
              } catch (error) {
                errors.push(`Issue #${issueNumber} could not be verified as an approved current-phase issue.`);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ["type:feature", "status:needs-review"],
            });
            for (const label of ["type:bug", "type:docs", "type:strategy", "status:needs-scorecard"]) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name: label,
              }).catch(() => {});
            }

            if (errors.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: errors.map(error => `- ${error}`).join("\n"),
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, state: "closed",
              });
              core.setFailed(errors.join(" "));
            }

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Mark proposals for maintainer triage
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`;
            const labels = ["status:triage"];
            if (/\battention\b|\bsdpa\b|\bqk\b|\bpv\b|\bprefill\b|\bdecode\b/i.test(text)) {
              labels.push("type:feature", "area:attention");
            } else if (/\bmatmul\b|\bgemm\b|\btile\b|\blayout\b/i.test(text)) {
              labels.push("type:feature", "area:matmul");
            } else {
              labels.push("type:question");
            }
            const { owner, repo } = context.repo;
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels,
            });
