name: Attention GPU batch (optional Windows runner)

# The maintainer normally runs the same command manually on the borrowed RTX
# 5070 Ti. This workflow is optional for a future self-hosted Windows runner;
# installing a runner is not required by the repository.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "PR count; 0 means all queued attention PRs"
        required: true
        default: "0"
      python_executable:
        description: "Existing CUDA Python interpreter"
        required: true
        default: ".venv\\Scripts\\python.exe"
      process:
        description: "Apply verdicts and merge/close (active frozen benchmark only)"
        type: boolean
        required: true
        default: false
      confirm_benchmark:
        description: "Exact benchmark ID required when process=true"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: attention-gpu-frontier
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, windows, gpu, rtx-5070-ti]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify pinned CUDA environment
        shell: pwsh
        env:
          PYTHON_EXECUTABLE: ${{ inputs.python_executable }}
        run: |
          & $env:PYTHON_EXECUTABLE -c "import sys,numpy,torch; assert torch.cuda.is_available(); assert torch.cuda.get_device_name(0) == 'NVIDIA GeForce RTX 5070 Ti'; print(sys.executable); print(numpy.__version__); print(torch.__version__); print(torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore protected queue state
        shell: pwsh
        env:
          PYTHON_EXECUTABLE: ${{ inputs.python_executable }}
        run: |
          git fetch origin bot/dashboard-state
          & $env:PYTHON_EXECUTABLE -c "from pathlib import Path; import subprocess; Path('dashboard/data.json').write_bytes(subprocess.check_output(['git','show','origin/bot/dashboard-state:dashboard/data.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evaluate sequential attention queue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_EXECUTABLE: ${{ inputs.python_executable }}
          LIMIT: ${{ inputs.limit }}
          PROCESS: ${{ inputs.process }}
          CONFIRM: ${{ inputs.confirm_benchmark }}
        run: |
          $args = @("--limit", $env:LIMIT, "--run", "--clean", "--active-python", "--repo", "${{ github.repository }}")
          if ($env:PROCESS -eq "true") {
            $args += @("--process", "--confirm-benchmark", $env:CONFIRM)
          }
          & $env:PYTHON_EXECUTABLE -m eval.attention_batch @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attention-foundation-rtx5070ti-results
          path: attention-results/**
          if-no-files-found: error
