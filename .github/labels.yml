# CCO label taxonomy — the single source of truth for repository labels.
#
# `labels-sync.yml` reads this file and reconciles the repo's labels with it
# (create missing, recolor/redescribe drifted). Edit here, not in the GitHub UI.
#
# Five families:
#   area:*   subsystem the issue/PR touches (auto-applied from changed paths)
#   type:*   what kind of contribution it is (auto-applied from title/template)
#   status:* review/triage state (applied by maintainers or the eval bot)
#   eval:*   deterministic PR verdict from eval.label / eval.pr_bot -- the
#            tier emitted by the protected evaluator; Gittensor registry
#            multipliers use these exact names when the phase is activated
#   (ungrouped) copycat enforcement + governance labels (eval.copycat_guard)

# ── area: subsystems ────────────────────────────────────────────────────────
- name: "area:strategy"
  color: "8250DF"
  description: "Smart strategies / transforms (strategy/)"
- name: "area:matmul"
  color: "006B75"
  description: "Exact engine and tile schedules (matmul/)"
- name: "area:attention"
  color: "0E8A16"
  description: "Exact and experimental attention implementations (attention/)"
- name: "area:eval"
  color: "0052CC"
  description: "Protected evaluator, metrics, artifacts, and policy (eval/, benchmarks/)"
- name: "area:tests"
  color: "C2E0C6"
  description: "Correctness gates and test suites (tests/)"
- name: "area:examples"
  color: "BFD4F2"
  description: "Runnable examples (examples/)"
- name: "area:docs"
  color: "0E8A16"
  description: "README, CONTRIBUTING, BENCHMARKS and other docs"
- name: "area:ci"
  color: "5319E7"
  description: "GitHub Actions and repository automation (.github/)"

# ── type: contribution kind ─────────────────────────────────────────────────
- name: "type:strategy"
  color: "D4C5F9"
  description: "New smart strategy / transform proposal"
- name: "type:feature"
  color: "1D76DB"
  description: "Measurable feature for the currently active benchmark phase"
- name: "type:bug"
  color: "B60205"
  description: "Bug report/fix; not an accepted miner PR lane"
- name: "type:enhancement"
  color: "1D76DB"
  description: "Legacy improvement label kept for backward compatibility"
- name: "type:docs"
  color: "FBCA04"
  description: "Documentation-only change; not an accepted miner PR lane"
- name: "type:question"
  color: "D876E3"
  description: "A question or discussion, not a change"

# ── status: triage / review state ───────────────────────────────────────────
- name: "status:needs-scorecard"
  color: "E99695"
  description: "Legacy square-evaluator compatibility label; not used by the attention phase"
- name: "status:needs-pr-kind"
  color: "F9D0C4"
  description: "PR must declare whether it is a fix/bug PR or a feat/strategy PR"
- name: "status:needs-review"
  color: "FBCA04"
  description: "Awaiting maintainer review"
- name: "status:changes-requested"
  color: "D93F0B"
  description: "Maintainer requested changes; new commit required within the review window"
- name: "status:maintainer-review"
  color: "BFD4F2"
  description: "Maintainer hold/manual review; disables stale auto-close"
- name: "status:ready-non-gpu"
  color: "C5DEF5"
  description: "Fix/docs PR cleared non-GPU triage; maintainer review only"
- name: "status:queued-gpu"
  color: "C2E0C6"
  description: "Current-phase feature passed admission and awaits protected RTX 5070 Ti evaluation"
- name: "status:protected-path"
  color: "B60205"
  description: "PR touches maintainer-owned files and is not eligible for the GPU queue"
- name: "status:triage"
  color: "C5DEF5"
  description: "Newly opened, not yet triaged"

# ── eval: deterministic verdict tiers ───────────────────────────────────────
- name: "eval:L"
  color: "1B998B"
  description: "Verified current-benchmark improvement, calibrated large tier"
- name: "eval:M"
  color: "2D9CDB"
  description: "Verified current-benchmark improvement, calibrated medium tier"
- name: "eval:S"
  color: "56CCF2"
  description: "Verified current-benchmark improvement, calibrated small tier"
- name: "eval:BASELINE"
  color: "6C63FF"
  description: "Legacy square-track baseline label"
- name: "eval:none"
  color: "D9D9D9"
  description: "Correct, but does not dominate exact on every cost axis (or gain too small to count)"
- name: "eval:REJECT"
  color: "B60205"
  description: "Failed correctness, protected regression, or active benchmark requirements"
- name: "eval:attention-draft"
  color: "BFD4F2"
  description: "Calibration-only attention result; cannot authorize merge or reward"

# ── copycat enforcement (eval.copycat_guard, eval.pr_bot) ──────────────────
- name: "copycat"
  color: "5C0011"
  description: "Blocked: substantially reproduces an earlier PR (see .github/COPYCATS.md)"
- name: "copycat-warn"
  color: "D93F0B"
  description: "Flagged for maintainer review: significant overlap with an earlier PR"
- name: "flagged:gaming"
  color: "000000"
  description: "Account blocked for gaming the scoring pipeline (see .github/FLAGGED.md)"
